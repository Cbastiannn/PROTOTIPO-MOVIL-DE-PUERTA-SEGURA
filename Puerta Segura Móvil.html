<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: una sola columna tipo app (max 440px), contenido arriba, barra de pestañas fija abajo.
   Color: marino profundo (--deep) + azul eléctrico (--accent) + estados verde/rojo/ámbar solo para acceso.
   Type: Bricolage Grotesque (títulos), DM Sans (texto), JetBrains Mono (placas y códigos). */
:root {
  --bg: #EEF3FA;
  --surface: #FFFFFF;
  --surface2: #E2EBF8;
  --fg: #0B1B33;
  --muted: #54677F;
  --line: #D0DCEC;
  --accent: #1F5FD6;
  --accent-fg: #FFFFFF;
  --accent-soft: #DCE8FC;
  --deep: #061626;
  --deep-fg: #EAF1FD;
  --deep-muted: #8EA5C6;
  --ok: #0C7A55;
  --ok-bg: #DAF3E8;
  --ok-solid: #0E8F63;
  --bad: #B83232;
  --bad-bg: #FBE2E2;
  --bad-solid: #C93A3A;
  --warn: #8A5A0B;
  --warn-bg: #FCEFD3;
  --shadow: 0 6px 24px rgba(8, 28, 64, .10);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060F22;
    --surface: #0E1D3A;
    --surface2: #162A50;
    --fg: #E8F0FC;
    --muted: #93A6C4;
    --line: #1F3459;
    --accent: #5B9BFF;
    --accent-fg: #04122B;
    --accent-soft: #15305E;
    --ok: #4FD3A0;
    --ok-bg: #0F3A2D;
    --ok-solid: #12936A;
    --bad: #FF8A8A;
    --bad-bg: #432024;
    --bad-solid: #CF4242;
    --warn: #F2BE62;
    --warn-bg: #3F3014;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060F22;
  --surface: #0E1D3A;
  --surface2: #162A50;
  --fg: #E8F0FC;
  --muted: #93A6C4;
  --line: #1F3459;
  --accent: #5B9BFF;
  --accent-fg: #04122B;
  --accent-soft: #15305E;
  --ok: #4FD3A0;
  --ok-bg: #0F3A2D;
  --ok-solid: #12936A;
  --bad: #FF8A8A;
  --bad-bg: #432024;
  --bad-solid: #CF4242;
  --warn: #F2BE62;
  --warn-bg: #3F3014;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 440px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; position: relative; }

/* ---------- Encabezado ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 18px 0 6px; }
.top .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; flex: none; }
.top .who { min-width: 0; flex: 1; }
.top .who b { display: block; font-family: var(--font-display); font-size: 17px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .who span { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; }
.pill-door { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 0; }
.pill-door.open { background: var(--ok-bg); color: var(--ok); }
.pill-door.closed { background: var(--bad-bg); color: var(--bad); }
.pill-door i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: block; }

h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.1; letter-spacing: -.01em; }
h2 { font-size: 19px; }
.sub { color: var(--muted); margin: 4px 0 0; }
.sec { display: grid; gap: 12px; padding-top: 16px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title small { color: var(--muted); }

/* ---------- Superficies ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.card.flat { box-shadow: none; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat b.ok { color: var(--ok); } .stat b.bad { color: var(--bad); }

.banner { border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.banner.open { background: var(--ok-bg); color: var(--ok); }
.banner.closed { background: var(--bad-bg); color: var(--bad); }
.banner .ico { width: 44px; height: 44px; border-radius: 12px; background: currentColor; display: grid; place-items: center; flex: none; }
.banner .ico svg { color: var(--surface); stroke-width: 2; }
.banner b { display: block; font-family: var(--font-display); font-size: 18px; }
.banner span { color: var(--fg); opacity: .85; font-size: 13.5px; }

/* ---------- Botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; background: var(--accent); color: var(--accent-fg); min-height: 48px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--bad-solid); color: #fff; }
.btn.go { background: var(--ok-solid); color: #fff; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field input[disabled] { background: var(--surface2); color: var(--muted); }
.field input.mono { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface2); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 700; color: var(--muted); min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 4px rgba(8, 28, 64, .15); }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px; }

/* ---------- Placa, insignias, listas ---------- */
.plate { display: inline-block; font-family: var(--font-mono); font-weight: 700; letter-spacing: .14em; border: 2px solid var(--fg); border-radius: 8px; padding: 3px 10px; background: var(--surface); font-size: 15px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.item .mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; font-weight: 800; }
.item .mark.in { background: var(--ok-bg); color: var(--ok); }
.item .mark.out { background: var(--accent-soft); color: var(--accent); }
.item .mark.no { background: var(--bad-bg); color: var(--bad); }
.item .mid { min-width: 0; flex: 1; }
.item .mid b { display: block; }
.item .mid small { color: var(--muted); display: block; overflow-wrap: anywhere; }
.item time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1.5px dashed var(--line); border-radius: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.switch { width: 52px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .18s; }
.switch[aria-checked="true"] { background: var(--ok-solid); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

/* ---------- QR ---------- */
.qr-card { text-align: center; display: grid; gap: 10px; justify-items: center; }
.qr-frame { background: #fff; padding: 14px; border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); line-height: 0; }
.qr-frame canvas, .qr-frame img { max-width: 100%; height: auto; }
.code { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; background: var(--surface2); border-radius: 10px; padding: 8px 10px; width: 100%; }

/* ---------- Puerta del vigilante ---------- */
.gate { border-radius: 22px; padding: 22px 18px; color: #fff; display: grid; gap: 14px; justify-items: center; text-align: center; }
.gate.closed { background: linear-gradient(160deg, #0A1F42, #14326A); }
.gate.open { background: linear-gradient(160deg, #0A6B4A, #12936A); }
.gate .big { width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 255, 255, .14); display: grid; place-items: center; }
.gate .big svg { width: 36px; height: 36px; stroke-width: 1.7; }
.gate h2 { font-size: 24px; letter-spacing: .02em; }
.gate p { margin: 0; opacity: .85; font-size: 14px; }
.gate .btn { background: #fff; color: #0A1F42; }

.viewfinder { position: relative; aspect-ratio: 1 / 1; max-height: 300px; width: 100%; background: radial-gradient(circle at 50% 40%, #12284F, #061626 70%); border-radius: 18px; overflow: hidden; display: grid; place-items: center; }
.viewfinder .c { position: absolute; width: 34px; height: 34px; border: 4px solid #6FA8FF; }
.viewfinder .c.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.viewfinder .c.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.viewfinder .c.bl { bottom: 22px; left: 22px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
.viewfinder .c.br { bottom: 22px; right: 22px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.viewfinder .line { position: absolute; left: 14%; right: 14%; height: 2px; background: linear-gradient(90deg, transparent, #8DBBFF, transparent); box-shadow: 0 0 12px #6FA8FF; animation: sweep 2.4s ease-in-out infinite; }
.viewfinder p { color: #9DB4D6; font-size: 13px; text-align: center; padding: 0 44px; margin: 0; }
@keyframes sweep { 0%, 100% { top: 22%; } 50% { top: 76%; } }
@media (prefers-reduced-motion: reduce) { .viewfinder .line { animation: none; top: 50%; } }

/* ---------- Resultado del escaneo ---------- */
.overlay { position: fixed; inset: 0; background: rgba(4, 12, 28, .6); z-index: 40; display: grid; align-items: end; justify-items: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.sheet { width: 100%; max-width: 440px; background: var(--surface); border-radius: 24px 24px 0 0; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .head { padding: 22px 18px; color: #fff; display: grid; gap: 4px; justify-items: center; text-align: center; }
.sheet .head.ok { background: var(--ok-solid); }
.sheet .head.no { background: var(--bad-solid); }
.sheet .head svg { width: 44px; height: 44px; stroke-width: 2.2; }
.sheet .head h2 { font-size: 22px; letter-spacing: .03em; }
.sheet .head p { margin: 0; opacity: .92; font-size: 14px; }
.sheet .body { padding: 16px 18px 18px; display: grid; gap: 4px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv:last-of-type { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv b { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.sheet .btn { margin-top: 10px; }

/* ---------- Barra inferior ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 440px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 9px 2px 8px; color: var(--muted); font-size: 11.5px; font-weight: 700; min-height: 56px; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.3; }

/* ---------- Inicio de sesión ---------- */
.hero { background: #061626; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 28px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); text-align: center; color: var(--deep-fg); }
.hero img { width: 190px; max-width: 70%; height: auto; mix-blend-mode: screen; display: block; margin: 0 auto 4px; }
.hero p { margin: 0; color: var(--deep-muted); font-size: 14px; }
.login { display: grid; gap: 14px; padding-top: 20px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 60; max-width: min(92vw, 400px); text-align: center; box-shadow: var(--shadow); }
.toast[hidden] { display: none; }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--accent); font-weight: 700; padding: 14px 0 0; }
</style>

<script>
/* ===================== Datos y estado ===================== */
var KEY = "puerta-segura-movil-v1";
var MIN = 60000, DIA = 24 * 60 * MIN;
var ahora = Date.now();

function sembrar() {
  return {
    door: false,
    users: [
      { id: "u1", rol: "estudiante", nombre: "Camila Rojas Prieto", cedula: "1070123456", correo: "estudiante@ucundinamarca.edu.co", clave: "Estudiante123", celular: "300 555 0142" },
      { id: "u2", rol: "vigilante", nombre: "Jorge Martínez", cedula: "79456123", correo: "vigilante@ucundinamarca.edu.co", clave: "Vigilante123", celular: "311 555 0188" },
      { id: "u3", rol: "estudiante", nombre: "Andrés Beltrán", cedula: "1070654321", correo: "andres@ucundinamarca.edu.co", clave: "Estudiante123", celular: "" }

      { id: "v2", ownerId: "u3", placa: "XYZ789", marca: "Renault", modelo: "Duster", color: "Gris", tipo: "Camioneta", activo: true, vence: ahora + 200 * DIA, qr: "PSU-v1-v2-XYZ789-4B8D10E2" },
      { id: "v3", ownerId: "u3", placa: "KLM456", marca: "Yamaha", modelo: "FZ 150", color: "Negro", tipo: "Moto", activo: false, vence: ahora + 120 * DIA, qr: "PSU-v1-v3-KLM456-77C0AB19" },
      { id: "v4", ownerId: "u3", placa: "QRS321", marca: "Chevrolet", modelo: "Spark", color: "Rojo", tipo: "Automóvil", activo: true, vence: ahora - 12 * DIA, qr: "PSU-v1-v4-QRS321-12EE5D08" }
    ],

      { vid: "v1", placa: "ABC123", dueno: "Camila Rojas Prieto", tipo: "entrada", ok: true, motivo: "", ts: ahora - 190 * MIN },
      { vid: "v2", placa: "XYZ789", dueno: "Andrés Beltrán", tipo: "entrada", ok: true, motivo: "", ts: ahora - 150 * MIN },
      { vid: "v3", placa: "KLM456", dueno: "Andrés Beltrán", tipo: "entrada", ok: false, motivo: "Vehículo desactivado", ts: ahora - 95 * MIN },
      { vid: "v1", placa: "ABC123", dueno: "Camila Rojas Prieto", tipo: "salida", ok: true, motivo: "", ts: ahora - 40 * MIN }
    ]
  };
}

var D = sembrar();
try {
  var guardado = JSON.parse(localStorage.getItem(KEY) || "null");
  if (guardado && guardado.vehicles && guardado.users && guardado.logs) D = guardado;
} catch (e) {}
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }

var S = { user: null, rolLogin: "estudiante", tab: "inicio", vista: null, vehSel: 0, tipo: "entrada", filtro: "todos", scan: null, error: "", registro: false };

/* ===================== Utilidades ===================== */
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function hora(ts) { return new Date(ts).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit", hour12: false }); }
function fecha(ts) { return new Date(ts).toLocaleDateString("es-CO", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function esHoy(ts) { return new Date(ts).toDateString() === new Date().toDateString(); }
function cuando(ts) { return esHoy(ts) ? "Hoy " + hora(ts) : fecha(ts) + " " + hora(ts); }
function iniciales(n) { var p = String(n || "?").trim().split(/\s+/); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
function primerNombre(n) { return String(n || "").trim().split(/\s+/)[0]; }
function aleatorio() { var s = ""; for (var i = 0; i < 8; i++) s += "0123456789ABCDEF"[Math.floor(Math.random() * 16)]; return s; }
function misVehiculos() { return D.vehicles.filter(function (v) { return v.ownerId === S.user.id; }); }
function porId(id) { return D.users.filter(function (u) { return u.id === id; })[0]; }
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2600);
}

/* ===================== Reglas de acceso ===================== */
function registrar(v, placa, tipo, ok, motivo) {
  D.logs.unshift({ vid: v ? v.id : null, placa: placa, dueno: v ? (porId(v.ownerId) || {}).nombre || "" : "", tipo: tipo, ok: ok, motivo: motivo || "", ts: Date.now() });
  guardar();
}
function procesarAcceso(v, textoIngresado, tipo) {
  var placa = v ? v.placa : "—";
  var dueno = v ? (porId(v.ownerId) || {}).nombre : "";
  var r = { ok: false, placa: placa, dueno: dueno, veh: v, tipo: tipo, ts: Date.now(), msg: "" };
  if (!D.door) { r.msg = "La puerta está cerrada. Ábrela antes de escanear."; registrar(v, v ? v.placa : "(sin leer)", tipo, false, "Puerta cerrada"); }
  else if (!v) { r.msg = "Código QR no reconocido en el sistema."; registrar(null, "DESCONOCIDO", tipo, false, "QR no registrado"); }
  else if (!v.activo) { r.msg = "El vehículo está desactivado."; registrar(v, v.placa, tipo, false, "Vehículo desactivado"); }
  else if (v.vence < Date.now()) { r.msg = "El QR venció el " + fecha(v.vence) + "."; registrar(v, v.placa, tipo, false, "QR vencido"); }
  else { r.ok = true; r.msg = tipo === "entrada" ? "Entrada registrada." : "Salida registrada."; registrar(v, v.placa, tipo, true, ""); }
  S.scan = r;
}
function buscarPorQr(codigo) { return D.vehicles.filter(function (v) { return v.qr === codigo.trim(); })[0] || null; }
function buscarPorPlaca(placa) { return D.vehicles.filter(function (v) { return v.placa === placa.trim().toUpperCase(); })[0] || null; }

/* ===================== Vistas ===================== */
function pillPuerta() {
  return '<span class="pill-door ' + (D.door ? "open" : "closed") + '"><i></i>' + (D.door ? "Puerta abierta" : "Puerta cerrada") + "</span>";
}
function encabezado(rolTxt) {
  return '<header class="top"><div class="avatar">' + esc(iniciales(S.user.nombre)) + '</div><div class="who"><b>' + esc(S.user.nombre) + "</b><span>" + rolTxt + "</span></div>" + pillPuerta() + "</header>";
}
function itemLog(l) {
  var cls = !l.ok ? "no" : l.tipo === "entrada" ? "in" : "out";
  var simbolo = !l.ok ? "✕" : l.tipo === "entrada" ? "↓" : "↑";
  var sub = l.ok ? (l.tipo === "entrada" ? "Entrada" : "Salida") : "Denegado · " + esc(l.motivo);
  return '<div class="item"><div class="mark ' + cls + '">' + simbolo + '</div><div class="mid"><b><span class="plate">' + esc(l.placa) + "</span></b><small>" + sub + (l.dueno ? " · " + esc(l.dueno) : "") + "</small></div><time>" + cuando(l.ts) + "</time></div>";
}

/* ----- Estudiante ----- */
function estInicio() {
  var mv = misVehiculos();
  var ids = mv.map(function (v) { return v.id; });
  var logs = D.logs.filter(function (l) { return ids.indexOf(l.vid) >= 0; });
  var ultimo = logs.length ? cuando(logs[0].ts) : "Sin registros";
  var activos = mv.filter(function (v) { return v.activo && v.vence > Date.now(); }).length;
  return encabezado("Estudiante") +
    '<div class="sec"><div><h1>Hola, ' + esc(primerNombre(S.user.nombre)) + "</h1><p class=\"sub\">Tu acceso al campus en un vistazo.</p></div>" +
    '<div class="banner ' + (D.door ? "open" : "closed") + '"><div class="ico">' + ic(D.door ? "unlock" : "lock") + "</div><div><b>" + (D.door ? "Puerta abierta" : "Puerta cerrada") + "</b><span>" + (D.door ? "Muestra tu QR al vigilante para ingresar." : "El vigilante debe abrirla. Tu QR no será válido mientras tanto.") + "</span></div></div>" +
    '<div class="stats"><div class="stat"><small>Vehículos</small><b>' + mv.length + '</b></div><div class="stat"><small>QR activos</small><b class="' + (activos ? "ok" : "bad") + '">' + activos + '</b></div><div class="stat"><small>Último</small><b style="font-size:15px;padding-top:6px">' + esc(ultimo) + "</b></div></div>" +
    '<div class="row2"><button class="btn" data-a="tab" data-v="qr">' + ic("qr") + 'Mi QR</button><button class="btn soft" data-a="tab" data-v="vehiculos">' + ic("car") + "Vehículos</button></div>" +
    '<div class="sec-title"><h2>Mis últimos accesos</h2></div>' +
    (logs.length ? '<div class="list">' + logs.slice(0, 5).map(itemLog).join("") + "</div>" : '<div class="empty">Aún no tienes accesos registrados.</div>') + "</div>";
}

function estQr() {
  var mv = misVehiculos();
  if (!mv.length) {
    return encabezado("Estudiante") + '<div class="sec"><h1>Mi código QR</h1><div class="empty">Aún no registras un vehículo.<br><br><button class="btn" data-a="nuevo-veh">' + ic("plus") + "Registrar vehículo</button></div></div>";
  }
  if (S.vehSel >= mv.length) S.vehSel = 0;
  var v = mv[S.vehSel];
  var vencido = v.vence < Date.now();
  var estado = !v.activo ? '<span class="badge bad">Desactivado</span>' : vencido ? '<span class="badge bad">Vencido</span>' : '<span class="badge ok">QR activo</span>';
  var chips = mv.length > 1 ? '<div class="chips">' + mv.map(function (x, i) { return '<button class="chip" data-a="sel-veh" data-v="' + i + '" aria-pressed="' + (i === S.vehSel) + '">' + esc(x.placa) + "</button>"; }).join("") + "</div>" : "";
  return encabezado("Estudiante") + '<div class="sec"><div><h1>Mi código QR</h1><p class="sub">Preséntalo al vigilante en la entrada.</p></div>' + chips +
    '<div class="card qr-card"><div class="qr-frame"><div id="qr-lienzo"></div></div><span class="plate">' + esc(v.placa) + "</span>" +
    '<div style="color:var(--muted)">' + esc(v.marca) + " " + esc(v.modelo) + " · " + esc(v.color) + "</div>" +
    '<div class="chips" style="justify-content:center">' + estado + '<span class="badge info">Vence ' + fecha(v.vence) + "</span></div>" +
    '<div class="code">' + esc(v.qr) + "</div></div>" +
    (D.door ? "" : '<div class="err">La puerta está cerrada. Espera a que el vigilante la abra para ingresar.</div>') + "</div>";
}

function estVehiculos() {
  var mv = misVehiculos();
  return encabezado("Estudiante") + '<div class="sec"><div class="sec-title"><h1>Mis vehículos</h1></div>' +
    '<button class="btn block" data-a="nuevo-veh">' + ic("plus") + "Registrar vehículo</button>" +
    (mv.length ? '<div class="list">' + mv.map(function (v) {
      var est = !v.activo ? '<span class="badge bad">Desactivado</span>' : v.vence < Date.now() ? '<span class="badge bad">QR vencido</span>' : '<span class="badge ok">Activo</span>';
      return '<div class="item"><div class="mid"><b><span class="plate">' + esc(v.placa) + "</span></b><small>" + esc(v.marca) + " " + esc(v.modelo) + " · " + esc(v.color) + " · " + esc(v.tipo) + "</small></div>" + est + "</div>";
    }).join("") + "</div>" : '<div class="empty">Sin vehículos registrados.</div>') + "</div>";
}

function estNuevoVehiculo() {
  return '<button class="back" data-a="cerrar-vista">' + ic("back") + "Volver</button>" +
    '<div class="sec"><div><h1>Registrar vehículo</h1><p class="sub">Al guardar se genera tu QR único.</p></div>' +
    (S.error ? '<div class="err" role="alert">' + esc(S.error) + "</div>" : "") +
    '<div class="field"><label for="n-placa">Placa (ABC123)</label><input id="n-placa" class="mono" maxlength="6" autocomplete="off"></div>' +
    '<div class="row2"><div class="field"><label for="n-marca">Marca</label><input id="n-marca"></div><div class="field"><label for="n-modelo">Modelo</label><input id="n-modelo"></div></div>' +
    '<div class="row2"><div class="field"><label for="n-color">Color</label><input id="n-color"></div><div class="field"><label for="n-tipo">Tipo</label><select id="n-tipo"><option>Automóvil</option><option>Moto</option><option>Camioneta</option></select></div></div>' +
    '<button class="btn block" data-a="guardar-veh">Guardar y generar QR</button>' +
    '<p class="hint">En el sistema web el QR también se envía a tu correo. Aquí el envío es simulado.</p></div>';
}

function estPerfil() {
  var u = S.user;
  return encabezado("Estudiante") + '<div class="sec"><h1>Mi perfil</h1>' +
    '<div class="field"><label for="p-nombre">Nombre completo</label><input id="p-nombre" value="' + esc(u.nombre) + '"></div>' +
    '<div class="row2"><div class="field"><label for="p-cedula">Cédula</label><input id="p-cedula" inputmode="numeric" value="' + esc(u.cedula) + '"></div><div class="field"><label for="p-cel">Celular</label><input id="p-cel" inputmode="tel" value="' + esc(u.celular) + '"></div></div>' +
    '<div class="field"><label for="p-correo">Correo</label><input id="p-correo" value="' + esc(u.correo) + '" disabled></div>' +

/* ----- Vigilante ----- */
function vigPuerta() {
  var hoy = D.logs.filter(function (l) { return esHoy(l.ts); });
  var ent = hoy.filter(function (l) { return l.ok && l.tipo === "entrada"; }).length;
  var sal = hoy.filter(function (l) { return l.ok && l.tipo === "salida"; }).length;
  var den = hoy.filter(function (l) { return !l.ok; }).length;
  var opciones = D.vehicles.map(function (v) { return '<option value="' + v.id + '">' + esc(v.placa) + " · " + esc(v.marca) + " " + esc(v.modelo) + "</option>"; }).join("") + '<option value="x">QR desconocido</option>';
  return encabezado("Vigilante · turno activo") + '<div class="sec">' +
    '<div class="gate ' + (D.door ? "open" : "closed") + '"><div class="big">' + ic(D.door ? "unlock" : "lock") + "</div><h2>" + (D.door ? "PUERTA ABIERTA" : "PUERTA CERRADA") + "</h2><p>" + (D.door ? "Los vehículos con QR válido pueden ingresar." : "Ningún QR será aceptado hasta que la abras.") + '</p><button class="btn block" data-a="puerta">' + (D.door ? "Cerrar puerta" : "Abrir puerta") + "</button></div>" +
    '<div class="stats"><div class="stat"><small>Entradas</small><b class="ok">' + ent + '</b></div><div class="stat"><small>Salidas</small><b>' + sal + '</b></div><div class="stat"><small>Denegados</small><b class="bad">' + den + "</b></div></div>" +
    '<div class="sec-title"><h2>Escanear QR</h2></div>' +
    '<div class="seg" role="group" aria-label="Tipo de acceso"><button data-a="tipo" data-v="entrada" aria-pressed="' + (S.tipo === "entrada") + '">↓ Entrada</button><button data-a="tipo" data-v="salida" aria-pressed="' + (S.tipo === "salida") + '">↑ Salida</button></div>' +
    '<div class="viewfinder"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="line"></div><p>La cámara real funciona en el sistema web. En este prototipo simula la lectura con el selector de abajo.</p></div>' +
    '<div class="field"><label for="sim">Simular lectura de</label><select id="sim">' + opciones + "</select></div>" +
    '<button class="btn block" data-a="simular">' + ic("scan") + "Simular lectura</button>" +
    '<div class="field"><label for="manual">Registro manual por placa</label><div class="row2" style="grid-template-columns:minmax(0,1fr) auto"><input id="manual" class="mono" maxlength="6" placeholder="ABC123" style="border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.12em"><button class="btn soft" data-a="manual">Registrar</button></div></div>' +
    '<div class="sec-title"><h2>Últimos movimientos</h2></div><div class="list">' + D.logs.slice(0, 3).map(itemLog).join("") + "</div></div>";
}

function vigHistorial() {
  var f = S.filtro;
  var lista = D.logs.filter(function (l) {
    return f === "todos" || (f === "denegado" ? !l.ok : l.ok && l.tipo === f);
  });
  var chips = [["todos", "Todos"], ["entrada", "Entradas"], ["salida", "Salidas"], ["denegado", "Denegados"]].map(function (c) {
    return '<button class="chip" data-a="filtro" data-v="' + c[0] + '" aria-pressed="' + (f === c[0]) + '">' + c[1] + "</button>";
  }).join("");
  return encabezado("Vigilante · turno activo") + '<div class="sec"><div class="sec-title"><h1>Historial</h1><small>' + lista.length + " registros</small></div><div class=\"chips\">" + chips + "</div>" +
    (lista.length ? '<div class="list">' + lista.map(itemLog).join("") + "</div>" : '<div class="empty">No hay registros con este filtro.</div>') + "</div>";
}

function vigVehiculos() {
  return encabezado("Vigilante · turno activo") + '<div class="sec"><div class="sec-title"><h1>Vehículos</h1><small>' + D.vehicles.length + " en el sistema</small></div>" +
    '<div class="list">' + D.vehicles.map(function (v) {
      var dueno = (porId(v.ownerId) || {}).nombre || "Sin dueño";
      var venc = v.vence < Date.now() ? '<span class="badge warn">QR vencido</span>' : "";
      return '<div class="item"><div class="mid"><b><span class="plate">' + esc(v.placa) + "</span> " + venc + "</b><small>" + esc(v.marca) + " " + esc(v.modelo) + " · " + esc(dueno) + '</small></div><button class="switch" role="switch" aria-checked="' + v.activo + '" aria-label="Vehículo ' + esc(v.placa) + ' activo" data-a="activar" data-v="' + v.id + '"></button></div>';
    }).join("") + '</div><p class="hint">El interruptor activa o desactiva el vehículo. Un vehículo desactivado no puede ingresar.</p></div>';
}

function vigPerfil() {
  var u = S.user;
  return encabezado("Vigilante · turno activo") + '<div class="sec"><div><h1>Mi turno</h1><p class="sub">Si cambia el vigilante, actualiza el nombre para que el historial quede claro.</p></div>' +
    '<div class="field"><label for="p-nombre">Nombre completo</label><input id="p-nombre" value="' + esc(u.nombre) + '"></div>' +
    '<div class="row2"><div class="field"><label for="p-cedula">Cédula</label><input id="p-cedula" inputmode="numeric" value="' + esc(u.cedula) + '"></div><div class="field"><label for="p-cel">Celular</label><input id="p-cel" inputmode="tel" value="' + esc(u.celular) + '"></div></div>' +
    '<div class="field"><label for="p-correo">Correo</label><input id="p-correo" value="' + esc(u.correo) + '" disabled></div>' +
    '<button class="btn block" data-a="guardar-perfil">Guardar turno</button><button class="btn ghost block" data-a="salir">' + ic("out") + "Cerrar sesión</button></div>";
}

function hojaResultado() {
  var r = S.scan;
  if (!r) return "";
  var v = r.veh;
  return '<div class="overlay" data-a="cerrar-scan"><div class="sheet" role="dialog" aria-modal="true" aria-label="Resultado del escaneo" data-stop="1">' +
    '<div class="head ' + (r.ok ? "ok" : "no") + '">' + ic(r.ok ? "check" : "x") + "<h2>" + (r.ok ? "ACCESO AUTORIZADO" : "ACCESO DENEGADO") + "</h2><p>" + esc(r.msg) + "</p></div>" +
    '<div class="body"><div class="kv"><span>Placa</span><b><span class="plate">' + esc(r.placa) + "</span></b></div>" +
    (r.dueno ? '<div class="kv"><span>Propietario</span><b>' + esc(r.dueno) + "</b></div>" : "") +
    (v ? '<div class="kv"><span>Vehículo</span><b>' + esc(v.marca) + " " + esc(v.modelo) + " · " + esc(v.color) + "</b></div>" : "") +
    '<div class="kv"><span>Movimiento</span><b>' + (r.tipo === "entrada" ? "↓ Entrada" : "↑ Salida") + '</b></div><div class="kv"><span>Hora</span><b>' + hora(r.ts) + '</b></div>' +
    '<button class="btn block ' + (r.ok ? "go" : "") + '" data-a="cerrar-scan">Listo</button></div></div></div>';
}

/* ===================== Render ===================== */
function barra() {
  var tabs = S.user.rol === "estudiante"
    ? [["inicio", "Inicio", "home"], ["qr", "Mi QR", "qr"], ["vehiculos", "Vehículos", "car"], ["perfil", "Perfil", "user"]]
    : [["puerta", "Puerta", "gate"], ["historial", "Historial", "clock"], ["vehiculos", "Vehículos", "car"], ["perfil", "Turno", "user"]];
  return '<div class="tabbar"><nav aria-label="Secciones">' + tabs.map(function (t) {
    return '<button data-a="tab" data-v="' + t[0] + '"' + (S.tab === t[0] && !S.vista ? ' aria-current="page"' : "") + ">" + ic(t[2]) + "<span>" + t[1] + "</span></button>";
  }).join("") + "</nav></div>";
}

function render() {
  var app = document.getElementById("app");
  var html;
  if (!S.user) {
    html = S.registro ? vistaRegistro() : vistaLogin();
  } else {
    var est = S.user.rol === "estudiante";
    var cuerpo;
    if (S.vista === "nuevo-veh") cuerpo = estNuevoVehiculo();
    else if (est) cuerpo = { inicio: estInicio, qr: estQr, vehiculos: estVehiculos, perfil: estPerfil }[S.tab]();
    else cuerpo = { puerta: vigPuerta, historial: vigHistorial, vehiculos: vigVehiculos, perfil: vigPerfil }[S.tab]();
    html = cuerpo + barra() + hojaResultado();
  }
  app.innerHTML = html;
  if (S.user && S.user.rol === "estudiante" && S.tab === "qr" && !S.vista) dibujarQr();
}

function dibujarQr() {
  var mv = misVehiculos();
  var el = document.getElementById("qr-lienzo");
  if (!el || !mv.length) return;
  var v = mv[S.vehSel] || mv[0];
  if (typeof QRCode === "undefined") { el.innerHTML = '<div style="width:200px;line-height:1.4;padding:30px 0;color:#333;font-size:13px">No se pudo cargar el generador de QR. Revisa tu conexión.</div>'; return; }
  el.innerHTML = "";
  try { new QRCode(el, { text: v.qr, width: 210, height: 210, colorDark: "#061626", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
}

/* ===================== Acciones ===================== */
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
function irA(tab) { S.tab = tab; S.vista = null; S.error = ""; render(); window.scrollTo(0, 0); }

var acciones = {
  "rol": function (v) { S.rolLogin = v; S.error = ""; render(); },
  "entrar": function () {
    var correo = val("l-correo").toLowerCase(), clave = document.getElementById("l-clave").value;
    var u = D.users.filter(function (x) { return x.correo.toLowerCase() === correo && x.clave === clave && x.rol === S.rolLogin; })[0];
    if (!u) { S.error = "Correo, contraseña o rol incorrectos."; render(); return; }
    S.user = u; S.error = ""; S.tab = u.rol === "estudiante" ? "inicio" : "puerta"; S.vista = null; S.vehSel = 0; render(); window.scrollTo(0, 0);
  },
  "ir-registro": function () { S.registro = true; S.error = ""; render(); },
  "ir-login": function () { S.registro = false; S.error = ""; render(); },
  "crear-cuenta": function () {
    var n = val("r-nombre"), c = val("r-cedula"), cel = val("r-cel"), co = val("r-correo").toLowerCase(), k = document.getElementById("r-clave").value, k2 = document.getElementById("r-clave2").value;
    if (!n || !c || !co || !k) { S.error = "Completa nombre, cédula, correo y contraseña."; render(); return; }
    if (!/^\d{6,12}$/.test(c)) { S.error = "La cédula debe tener entre 6 y 12 dígitos."; render(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(co)) { S.error = "Escribe un correo válido."; render(); return; }
    if (k.length < 8) { S.error = "La contraseña debe tener al menos 8 caracteres."; render(); return; }
    if (k !== k2) { S.error = "Las contraseñas no coinciden."; render(); return; }
    if (D.users.some(function (x) { return x.correo.toLowerCase() === co || x.cedula === c; })) { S.error = "Ese correo o cédula ya está registrado."; render(); return; }
    var nuevo = { id: "u" + Date.now(), rol: "estudiante", nombre: n, cedula: c, correo: co, clave: k, celular: cel };
    D.users.push(nuevo); guardar();
    S.user = nuevo; S.registro = false; S.error = ""; S.tab = "inicio"; render(); toast("Cuenta creada. Bienvenido, " + primerNombre(n) + ".");
  },
  "salir": function () { S.user = null; S.vista = null; S.scan = null; S.error = ""; render(); window.scrollTo(0, 0); },
  "tab": function (v) { irA(v); },
  "sel-veh": function (v) { S.vehSel = parseInt(v, 10); render(); },
  "nuevo-veh": function () { S.vista = "nuevo-veh"; S.error = ""; render(); window.scrollTo(0, 0); },
  "cerrar-vista": function () { S.vista = null; S.error = ""; render(); },
  "guardar-veh": function () {
    var placa = val("n-placa").toUpperCase(), marca = val("n-marca"), modelo = val("n-modelo"), color = val("n-color"), tipo = document.getElementById("n-tipo").value;
    if (!placa || !marca || !color) { S.error = "Completa placa, marca y color."; render(); return; }
    if (!/^[A-Z]{3}\d{3}$/.test(placa)) { S.error = "La placa debe tener el formato ABC123."; render(); return; }
    if (D.vehicles.some(function (x) { return x.placa === placa; })) { S.error = "Esa placa ya está registrada."; render(); return; }
    var id = "v" + Date.now();
    D.vehicles.push({ id: id, ownerId: S.user.id, placa: placa, marca: marca, modelo: modelo, color: color, tipo: tipo, activo: true, vence: Date.now() + 365 * DIA, qr: "PSU-v1-" + id + "-" + placa + "-" + aleatorio() });
    guardar();
    S.vehSel = misVehiculos().length - 1; S.vista = null; S.tab = "qr"; S.error = ""; render(); window.scrollTo(0, 0); toast("Vehículo registrado. Tu QR está listo.");
  },
  "guardar-perfil": function () {
    var n = val("p-nombre");
    if (!n) { toast("El nombre es obligatorio."); return; }
    S.user.nombre = n; S.user.cedula = val("p-cedula"); S.user.celular = val("p-cel");
    guardar(); render(); toast(S.user.rol === "vigilante" ? "Turno actualizado." : "Perfil actualizado.");
  },
  "puerta": function () { D.door = !D.door; guardar(); render(); toast(D.door ? "Puerta abierta" : "Puerta cerrada"); },
  "tipo": function (v) { S.tipo = v; render(); },
  "simular": function () {
    var id = document.getElementById("sim").value;
    var v = id === "x" ? null : D.vehicles.filter(function (x) { return x.id === id; })[0];
    procesarAcceso(v, v ? v.qr : "PSU-v1-desconocido", S.tipo); render();
  },
  "manual": function () {
    var placa = val("manual").toUpperCase();
    if (!/^[A-Z]{3}\d{3}$/.test(placa)) { toast("Escribe una placa válida, por ejemplo ABC123."); return; }
    procesarAcceso(buscarPorPlaca(placa), placa, S.tipo);
    if (S.scan && !S.scan.veh) { S.scan.placa = placa; S.scan.msg = D.door ? "Placa no registrada en el sistema." : S.scan.msg; D.logs[0].placa = placa; D.logs[0].motivo = D.door ? "Placa no registrada" : D.logs[0].motivo; guardar(); }
    render();
  },
  "cerrar-scan": function () { S.scan = null; render(); },
  "filtro": function (v) { S.filtro = v; render(); },
  "activar": function (id) {
    var v = D.vehicles.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    v.activo = !v.activo; guardar(); render(); toast("Vehículo " + v.placa + (v.activo ? " activado" : " desactivado"));
  }
};

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-a]");
  if (!t) return;
  /* un clic dentro de la hoja que no cae en un botón no debe cerrar el resultado */
  if (t.classList.contains("overlay") && e.target.closest("[data-stop]")) return;
  var fn = acciones[t.getAttribute("data-a")];
  if (fn) fn(t.getAttribute("data-v"));
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !S.user) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input") { var b = document.querySelector('[data-a="entrar"]'); if (b && !S.registro) b.click(); }
  }
  if (e.key === "Escape" && S.scan) { S.scan = null; render(); }
});

render();
</script>

</body></html>
